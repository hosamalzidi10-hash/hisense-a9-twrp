name: Build Hisense A9 TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        run: |
          sudo apt-get update
          sudo apt-get install -y git repo bc bison build-essential \
            curl flex g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32ncurses-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3

      - name: Sync TWRP
        run: |
          mkdir twrp
          cd twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c --no-clone-bundle --no-tags -j2

      - name: Add device tree
        run: |
          mkdir -p twrp/device/hisense
          cp -r device-tree twrp/device/hisense/HLTE556N

      - name: Build
        run: |
          cd twrp
          source build/envsetup.sh
          lunch omni_HLTE556N-eng
          mka recoveryimage -j2

      - name: Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: Hisense-A9-TWRP
          path: twrp/out/target/product/HLTE556N/recovery.img
